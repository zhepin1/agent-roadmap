[project]
name = "agent-roadmap"
version = "0.1.0"
description = "AI Agent 学习路线的练习仓库"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["week01"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E=pycodestyle 错误, F=pyflakes 逻辑错, I=import 排序
select = ["E", "F", "I"]
